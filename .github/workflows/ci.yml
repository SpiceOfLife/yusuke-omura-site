# PR: ビルド → 検査 → スモークテスト → Cloudflare Pages のプレビュー（pr-番号 ブランチ）へ公開し、URL を PR にコメント
# main への push: 同じ検査のあと本番へ公開し、各ページが 200 を返すか確認
name: CI / Deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # ブログ同期（blog-sync.yml）が記事を更新したあとに呼び出す
  workflow_call:
    inputs:
      ref: { type: string, required: false, default: "" }

permissions:
  contents: read

# PR は新しい push で古い実行を止める。main は順番に1つずつ本番へ出す
# グループ名に github.workflow を使うと、ブログ同期から呼ばれたとき（"Blog sync"）と
# push で動いたとき（"CI / Deploy"）で別グループになり、2つの公開が同時に走って
# 古いほうが後から本番を上書きしてしまう。本番公開はブランチ名だけで1つのグループにまとめる
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('deploy-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: yusuke-omura

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # PR 以外は、そのブランチの「実行開始時点の最新」をビルドする。
      # push 時点のコミットに固定すると、順番待ちのあとに古い内容で本番を上書きしてしまうため
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event_name != 'pull_request' && github.ref_name || '' }}" }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:sync
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v6
        with: { name: dist, path: dist, include-hidden-files: true, retention-days: 7 }

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/download-artifact@v7
        with: { name: dist, path: dist }
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.142.0 pages deploy dist --project-name "$PROJECT" --branch "pr-${{ github.event.number }}" | tee out.txt
          echo "url=https://pr-${{ github.event.number }}.$PROJECT.pages.dev" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
              body: `プレビュー: ${{ steps.deploy.outputs.url }}\n（コミット ${context.sha.slice(0, 7)}）` });

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with: { name: dist, path: dist }
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.142.0 pages deploy dist --project-name "$PROJECT" --branch main
      - name: 本番URLの確認
        run: |
          sleep 15
          base="${{ vars.SITE_URL || 'https://yusuke-omura.pages.dev' }}"
          for p in / /profile /works /numbers /lab /live /blog/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$p"); echo "$p $code"; test "$code" = 200
          done
      - name: 検索エンジンに更新を知らせる（IndexNow：Bing など）
        # Google は IndexNow を使わないので、Google にはサイトマップ（Search Console に登録済み）で伝わる
        continue-on-error: true
        run: |
          base="${{ vars.SITE_URL || 'https://yusuke-omura.pages.dev' }}"
          key=$(ls dist | sed -n 's/^\([0-9a-f]\{32\}\)\.txt$/\1/p' | head -1)
          [ -n "$key" ] || exit 0
          urls=$(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed 's#</\?loc>##g' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify(s.trim().split("\n"))))')
          host=$(echo "$base" | sed 's#https\?://##; s#/.*##')
          curl -s -o /dev/null -w 'IndexNow %{http_code}\n' -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$host\",\"key\":\"$key\",\"keyLocation\":\"$base/$key.txt\",\"urlList\":$urls}" https://api.indexnow.org/indexnow
